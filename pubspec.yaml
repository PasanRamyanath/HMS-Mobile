name: hms_mobile
description: "Sri Lanka Cloud SaaS Hospitality Management System (HMS) Mobile App - Web Theme Edition."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  crypto: ^3.0.7
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/graphql/
    - assets/graphql/hms_aws_config.json
    - assets/graphql/operations.graphql
    - assets/graphql/schema.graphql
    - assets/images/
    - assets/images/rooms/
    - assets/icons/
    - assets/images/galle-fort-villa-hero.jpg
    - assets/images/boutique-courtyard-login.jpg
    - assets/images/room-deluxe-ocean.jpg
    - assets/images/room-beachfront-pool-villa.jpg
    - assets/images/room-heritage-master-suite.jpg
    - assets/images/spa-ayurveda-pavilion.jpg
    - assets/images/dish-jaffna-crab-hoppers.jpg
    - assets/images/dish-cuttlefish-arrack.jpg
    - assets/images/rooms/deluxe-ocean.webp
    - assets/images/rooms/family-chalet.webp
    - assets/images/rooms/standard-double.webp
    - assets/icons/icon-192.png
    - assets/icons/icon-512.png
