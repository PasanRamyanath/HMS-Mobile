name: Build iOS (Unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Release
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA Archive
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r CeylonHMS-Unsigned.ipa Payload
          cd ../../..

      - name: Upload iOS App Archive
        uses: actions/upload-artifact@v4
        with:
          name: ceylon-hms-ios-ipa
          path: build/ios/ipa/CeylonHMS-Unsigned.ipa
